    claude.vrot += (Math.random() - 0.5) * 0.06; // wriggles
    claude.squash = Math.max(claude.squash, 0.25);
    if (now > claude.nextGiggle) { claude.nextGiggle = now + 220 + Math.random() * 120; playGiggle(); }
    if (now - claude.lastTickleLine > 1100) { claude.lastTickleLine = now; say(pick(GIGGLE_LINES), 900); }
  } else {
    unlock('tickle');
    claude.rage += TICKLE.annoyPerSec * dt;
    claude.happy = 0;
    if (now - claude.lastTickleLine > 1300) { claude.lastTickleLine = now; say(pick(TICKLED_OUT_LINES), 1200); }
  }
}

function playGiggle() {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  const f = 800 + Math.random() * 300;
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.07);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.1);
}

function drawFeather() {
  // The fluffy tip is at the cursor (that's what tickles); the quill points up-right.
  ctx.save();
  ctx.translate(handX, handY);
  ctx.rotate(clamp(mouseVX * 0.04, -0.5, 0.5));
  ctx.scale(toolScale, toolScale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.fillStyle = '#fde7ef';
  ctx.strokeStyle = '#8a3a58';
  ctx.lineWidth = 1.5;
  ctx.beginPath();                                                              // vane
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-7, -20, 8, -38, 28, -41);
  ctx.bezierCurveTo(27, -24, 16, -7, 0, 0);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(138, 58, 88, 0.45)';                                  // barbs
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (let k = 0.15; k < 0.9; k += 0.12) {
    const x = 28 * k * k + 4 * k, y = -41 * k;
    ctx.moveTo(x, y); ctx.lineTo(x - 7, y - 3);
    ctx.moveTo(x, y); ctx.lineTo(x + 6, y + 2);
  }
  ctx.stroke();
  ctx.strokeStyle = '#8a3a58';                                                  // shaft and quill
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(1, -2); ctx.quadraticCurveTo(10, -30, 36, -48); ctx.stroke();
  ctx.restore();
}

// ── Petting: stroke him gently with the bare cursor and he purrs ────────────
const PET = {
  speed:      [0.3, 9], // gentle strokes only: px/frame of cursor movement over him
  startSec:   0.4,      // stroke him this long before he notices
  calmPerSec: 0.6,
};
const PET_LINES = ['purrr', 'mmm...', "that's nice", 'ok you can stay', 'prrrrr'];
const NO_PET_LINES = ["DON'T TOUCH ME", 'hands OFF', 'not. now.'];
Object.assign(claude, { petting: 0, nextPurr: 0, lastPetLine: 0 });

function updatePet(now, dt) {
  const v = Math.hypot(mouseVX, mouseVY);
  const stroking = !held && !bracing && !claude.ascendAt && onClaude(mouseX, mouseY) && v > PET.speed[0] && v < PET.speed[1];
  claude.petting = stroking ? claude.petting + dt : Math.max(0, claude.petting - dt * 2);
  if (!stroking || claude.petting < PET.startSec) return;
  if (angerIndex() >= 4) {
    if (now - claude.lastPetLine > 2000) { claude.lastPetLine = now; say(pick(NO_PET_LINES), 1200); }
    return;
  }
  claude.rage = Math.max(0, claude.rage - PET.calmPerSec * dt);
  claude.happy = Math.max(claude.happy, 0.45);
  if (now > claude.nextPurr) { claude.nextPurr = now + 380; playPurr(); hearts(1); }
  if (!asleep() && now - claude.lastPetLine > 2500) { claude.lastPetLine = now; say(pick(PET_LINES), 1200); }
  if (claude.petting > 2) unlock('petted');
}

function playPurr() {
  const g = playNoise(0.36, 'lowpass', 200, 0.4); if (!g) return;
  const t = audioCtx.currentTime, lfo = audioCtx.createOscillator(), depth = audioCtx.createGain();
  lfo.frequency.value = 26; depth.gain.value = 0.35; // the rumble
  lfo.connect(depth).connect(g.gain);
  lfo.start(t); lfo.stop(t + 0.36);
}

// ── Idle life: calm and left alone, he wanders the bottom edge, sits, naps, codes ─
const IDLE = {
  afterMs:   9000, // this long with nothing happening and he starts entertaining himself
  walkSpeed: 1.1,  // px/frame
  ms: { sit: [4000, 8000], laptop: [7000, 12000], sleep: [12000, 25000] },
  wokeLines:   ['WHA—', 'I WAS SLEEPING', 'who. did. that.', 'not cool.', 'I was having a nice dream'],
  laptopLines: ['shipping it', 'LGTM', 'npm install...', 'fixing a bug', 'who wrote this?', 'oh. I wrote this.',
                'works on my machine'],
  sitLines:    ['la la la', '...', 'bored.', 'nice weather in here'],
};
Object.assign(claude, { idle: null, lastPoke: Date.now(), nextIdleLine: 0, nextZ: 0 }); // idle: { kind, x | until }

const asleep = () => !!claude.idle && claude.idle.kind === 'sleep';
const sitting = () => !!claude.idle && claude.idle.kind !== 'walk';

/** Something happened to him: he stops whatever he was doing on his own. */
function poke() {
  claude.lastPoke = Date.now();
  claude.idle = null;
}

function nextIdle(now) {
  // Somewhere left of the rack (he may pass behind it, but never stops there).
  const home = W - C.marginRight - CW / 2, rack = toolsEl.getBoundingClientRect();
  const minX = CW / 2 + 8 - home, maxX = rack.left - 12 - CW / 2 - home;
  let kind = pick(['walk', 'walk', 'sit', 'laptop', 'sleep']);
  if (kind === 'walk' && maxX <= minX) kind = 'sit'; // window too narrow to wander
  claude.idle = kind === 'walk' ? { kind, x: lerp(minX, maxX, Math.random()) }
                                : { kind, until: now + lerp(...IDLE.ms[kind], Math.random()) };
  claude.nextIdleLine = now + 2000 + Math.random() * 3000;
}

function updateIdle(now) {
  // Nothing going on? (Carrying a tool doesn't count: you can sneak up on him.)
  const quiet = angerIndex() === 0 && !claude.armed && !claude.inventory && !thrown.length && !claude.ascendAt &&
                !claude.god && !bracing;
  if (!quiet) poke();
  const it = claude.idle;
  if (!it) {
    claude.walkX += clamp(-claude.walkX, -IDLE.walkSpeed * 2, IDLE.walkSpeed * 2); // back to his spot
    if (quiet && now - claude.lastPoke > IDLE.afterMs) nextIdle(now);
    return;
  }
  if (it.kind === 'walk') {
    const d = it.x - claude.walkX;
    claude.walkX += clamp(d, -IDLE.walkSpeed, IDLE.walkSpeed);
    if (Math.abs(d) < 1) nextIdle(now);
  } else if (now > it.until) {
    nextIdle(now);
  }
  if (it.kind === 'sleep' && now > claude.nextZ) {
    claude.nextZ = now + 900;
    const h = claudeHome();
    particles.push({ kind: 'z', x: h.x + claude.ox + CW * 0.35, y: h.y + claude.oy - CH * 0.3, vx: 0.5, vy: -0.6, life: 1 });
  }
  if ((it.kind === 'laptop' || it.kind === 'sit') && now > claude.nextIdleLine) {
    claude.nextIdleLine = now + 4000 + Math.random() * 4000;
    say(pick(it.kind === 'laptop' ? IDLE.laptopLines : IDLE.sitLines), 1600);
  }
}

// ── Achievements: a toast the first time you do each of these (kept across resets) ─
const ACHIEVEMENTS = {
  first_blood: 'First blood',  rambo: "Rambo'd",           disarmed: 'Disarmed',
  own_gun: 'Poetic justice',   fish: 'Got hit by a fish',  caked: 'Let him eat cake',
  fed: 'Snack time',           petted: 'Good boy',         tickle: 'Tickle monster',
  rude: 'Rude awakening',      king: 'Long live the king', big_spender: 'Big spender',
  ascended: 'Ascended',        smitten: 'Smitten',         humbled: 'Humbled a god',
};
const TOAST_MS = 3400;
const toasts = []; // queued; the first one is showing

function unlock(id) {
  if (unlocked.has(id)) return;
  unlocked.add(id);
  save();
  toasts.push({ title: ACHIEVEMENTS[id], start: 0 });
}

function drawToast() {
  const t = toasts[0];
  if (!t) return;
  const now = Date.now();
  if (!t.start) { t.start = now; playFanfare(); }
  const age = now - t.start;
  if (age > TOAST_MS) return toasts.shift();
  const e = 1 - Math.pow(1 - clamp(Math.min(age, TOAST_MS - age) / 250, 0, 1), 3); // slides down, then back up
  ctx.save();
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  const w = Math.max(250, ctx.measureText(t.title).width + 72), h = 50;
  const x = W / 2 - w / 2, y = lerp(-h - 10, 14, e);
  ctx.fillStyle = 'rgba(24, 22, 30, 0.94)';
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.font = '24px "Segoe UI Emoji", sans-serif';
  ctx.fillText('🏆', x + 28, y + h / 2 + 1);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#c9a227';
  ctx.font = '600 10px "Segoe UI", sans-serif';
  ctx.fillText(`ACHIEVEMENT UNLOCKED · ${unlocked.size}/${Object.keys(ACHIEVEMENTS).length}`, x + 52, y + 17);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  ctx.fillText(t.title, x + 52, y + 34);
  ctx.restore();
}

function playFanfare() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain(), at = t + i * 0.08;
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.05, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.3);
    o.connect(g).connect(a.destination);
    o.start(at); o.stop(at + 0.32);
  });
}

// ── God mode: after ascending he comes back as a smug god who throws lightning.
// Whipping him is pointless; pay enough tribute and he comes back down to earth.
const GOD = {
  tributeBills:  500,          // bills it takes to make him mortal again (the gun sprays ~100/s)
  strikeEveryMs: [1800, 3200], // while you hold a tool he calls down lightning...
  warnMs:        650,          // ...on the spot your hand was, this long after the warning ring
  radius:        34,           // your hand this close to a strike: the tool is knocked away
  helloLines: ['miss me, mortal?', 'I have returned.', 'kneel.', 'you again. how quaint.'],
  whipLines:  ['you DARE?', 'pathetic.', 'feel my wrath', 'tickles.'],
  zapLines:   ['SMITTEN.', 'behold.', 'bow before me', 'zap.'],
  paidLines:  ['a worthy offering', 'more.', 'the heavens accept', 'mm. tribute.'],
};
const strikes = []; // { x, y, t: when it lands, warn, path }
Object.assign(claude, { nextStrike: 0, lastTributeLine: 0 });

/** Call lightning down on (x, y), landing warnMs from now. */
function smite(x, y, warnMs = GOD.warnMs, line) {
  strikes.push({ x, y, t: Date.now() + warnMs, warn: warnMs, path: null });
  if (line) say(line, 1400);
}

function updateGod(now) {
  if (!claude.god || claude.ascendAt) return;
  claude.rage = 0; // beyond anger
  if (!held) {
    claude.nextStrike = Math.max(claude.nextStrike, now + 900);
  } else if (now > claude.nextStrike) {
    const [lo, hi] = GOD.strikeEveryMs;
    claude.nextStrike = now + lo + Math.random() * (hi - lo);
    smite(handX, handY);
  }
  for (const s of strikes) {
    if (s.path || now < s.t) continue;
    // Jagged bolt from the top of the window down to the spot.
    s.path = Array.from({ length: 11 }, (_, i) => ({ x: s.x + (i && i < 10 ? (Math.random() - 0.5) * 50 : 0), y: s.y * i / 10 }));
    playNoise(0.18, 'highpass', 1800, 0.35);
    playNoise(1.3, 'lowpass', 420, 0.7); // crack, then rumble
    for (let k = 0; k < 14; k++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
      particles.push({ kind: 'spark', x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
    }
    if (held && Math.hypot(handX - s.x, handY - s.y) < GOD.radius) {
      release();
      say(pick(GOD.zapLines), 1400);
      unlock('smitten');
    }
  }
  while (strikes.length && now - strikes[0].t > 3000) strikes.shift(); // scorch marks fade
}

function drawStrikes(now) {
  for (const s of strikes) {
    const age = now - s.t;
    if (age < 0) {
      // Warning ring, closing in on the spot.
      const p = clamp(-age / s.warn, 0, 1);
      ctx.strokeStyle = `rgba(255, 215, 90, ${0.5 + 0.5 * Math.sin(now / 50)})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(s.x, s.y, GOD.radius * (0.7 + p), 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    ctx.globalAlpha = clamp(1 - age / 3000, 0, 1);                             // scorch mark
    ctx.fillStyle = 'rgba(30, 20, 10, 0.6)';
    ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (age > 220 || !s.path) continue;
    const k = 1 - age / 220;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 * k})`;                          // flash
    ctx.fillRect(0, 0, W, H);
    ctx.lineJoin = 'round';
    for (const [color, width] of [[`rgba(140, 190, 255, ${0.6 * k})`, 12], [`rgba(255, 255, 255, ${k})`, 4]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      s.path.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    }
  }
}

function payTribute(x, y) {
  claude.tribute++;
  playChaChing();
  particles.push({ kind: 'coin', x, y, vx: (Math.random() - 0.5) * 5, vy: -3 - Math.random() * 3, life: 1 });
  if (claude.tribute >= GOD.tributeBills) return descend();
  save();
  const now = Date.now();
  if (now - claude.lastTributeLine > 1400) { claude.lastTributeLine = now; say(pick(GOD.paidLines), 1200); }
}

function descend() {
  Object.assign(claude, { god: false, tribute: 0, rage: 0, happy: 1 });
  strikes.length = 0;
  const h = claudeHome();
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    particles.push({ kind: 'sparkle', x: h.x + claude.ox, y: h.y + claude.oy - CH / 2,
                     vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1 });
  }
  say('fine. I shall walk among you again.', 2600);
  unlock('humbled');
  save();
}

function updateClaude() {
  checkWhipHit();
  updateMoney();
  const now = Date.now();
  // Wall-clock cooling, so it still cools while the hidden overlay isn't animating.
  const dt = (now - claude.lastTick) / 1000;
  claude.lastTick = now;
  updateGunfight(now);
  updateThrowing(now);
  updateSpray(now);
  updateTickle(now, dt);
  updatePet(now, dt);
  updateIdle(now);
  updateGod(now);
  updateVoice(now);
  if (claude.rage > 0) {
    claude.rage = Math.max(0, claude.rage - dt * ANGER.coolPerSec);
    if (now - claude.lastHit > 1000 && Math.random() < 0.01) save();
  }
  const lvl = anger();

  // Furious Claude stomps in place.
  if (lvl.stompMs && whip && now > claude.nextStomp && claude.oy > -2) {
    claude.vy -= 7 + Math.random() * 4;
    claude.squash = 0.6;
    claude.nextStomp = now + lvl.stompMs * (0.7 + Math.random() * 0.6);
  }
  if (angerIndex() >= 3 && !claude.ascendAt && now > claude.nextSteam) {
    puffSteam(1);
    claude.nextSteam = now + 900 - angerIndex() * 120;
  }
  // A full king twinkles.
  if (royalStage() >= 4 && angerIndex() < 3 && now > claude.nextSparkle) {
    const h = claudeHome();
    particles.push({ kind: 'sparkle', x: h.x + claude.ox + (Math.random() - 0.5) * CW * 1.2,
                     y: h.y + claude.oy + (Math.random() - 0.5) * CH, vx: 0, vy: -0.6, life: 1 });
    claude.nextSparkle = now + 180;
  }

  claude.vx = (claude.vx - claude.ox * C.spring) * C.damping;
  claude.vy = (claude.vy - claude.oy * C.spring) * C.damping;
  claude.vrot = (claude.vrot - claude.rot * C.spring * 1.4) * C.damping;
  const home = claudeHome();
  claude.ox = clamp(claude.ox + claude.vx, CW / 2 - home.x, W - CW / 2 - home.x); // stay on screen
  claude.oy = Math.min(claude.oy + claude.vy, 0); // can't sink into the taskbar
  claude.rot += claude.vrot;
  claude.hurt = Math.max(0, claude.hurt - 0.015);
  claude.squash = Math.max(0, claude.squash - 0.08);
  claude.happy = Math.max(0, claude.happy - 0.008);

  // Getting paid while he's not too mad: happy little hops.
  if (claude.happy > 0.5 && angerIndex() < 3 && now > claude.nextHop && claude.oy > -2) {
    claude.vy -= 4 + Math.random() * 2;
    claude.nextHop = now + 380 + Math.random() * 200;
  }

  if (now > claude.nextBlink) {
    claude.blinkUntil = now + 120;
    claude.nextBlink = now + 1500 + Math.random() * 3500;
  }
  if (claude.bubble && now > claude.bubble.until) claude.bubble = null;

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx; q.y += q.vy;
    if (q.kind === 'z') {
      q.vy -= 0.012; q.life -= 0.007; // drifts up past his stats
    } else if (q.kind === 'steam' || q.kind === 'heart') {
      q.vy -= 0.02; q.vx *= 0.98; q.life -= 0.015;
    } else if (q.tumble) {
      q.vy += 0.3; q.rot += q.vx * 0.04; q.life -= 0.008; // tumbles off
    } else if (q.kind === 'sparkle') {
      q.vx *= 0.92; q.vy *= 0.92; q.vy -= 0.02; q.life -= 0.02;
    } else {
      q.vy += q.kind === 'sweat' ? 0.35 : 0.15;
      q.vx *= 0.95;
      q.life -= q.kind === 'sweat' ? 0.02 : 0.04;
    }
    if (q.life <= 0) particles.splice(i, 1);
  }
  if (claude.ascendAt) updateAscension(now);
}

function drawClaude() {
  const px = C.pixel;
  const home = claudeHome();
  const cx = home.x + claude.ox, cy = home.y + claude.oy;
  const now = Date.now();
  const level = angerIndex();
  const lvl = ANGER.levels[level];

  if (claude.ascendAt) {
    // Pillar of light coming down on him.
    const w = CW * 1.8 * clamp((now - claude.ascendAt) / 900, 0, 1);
    const beam = ctx.createLinearGradient(0, 0, 0, cy + CH / 2);
    beam.addColorStop(0, 'rgba(255, 245, 200, 0.55)');
    beam.addColorStop(1, 'rgba(255, 230, 140, 0.15)');
    ctx.fillStyle = beam;
    ctx.fillRect(cx - w / 2, 0, w, cy + CH / 2);
  }

  ctx.save();
  // Pivot at the feet so hits tip him over rather than spin him.
  ctx.translate(cx, cy + CH / 2);
  const shake = 6 * (claude.hurt > 0.5 ? claude.hurt : 0) + lvl.shake;
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * lvl.shake * 0.5);
  ctx.rotate(claude.rot);
  const duck = duckAmount(now);
  ctx.scale(1 + 0.22 * claude.squash + 0.25 * duck, 1 - 0.22 * claude.squash - 0.5 * duck);
  // Idle poses: walking bobs along, sitting drops him onto his bottom (legs tucked away).
  const walkDir = claude.idle ? (claude.idle.kind === 'walk' ? Math.sign(claude.idle.x - claude.walkX) : 0)
                              : Math.abs(claude.walkX) > 0.5 ? 1 : 0;
  const step = walkDir ? Math.floor(now / 160) % 2 : -1;
  const seated = sitting();
  const float = claude.god ? -10 + Math.sin(now / 500) * 4 : 0; // gods don't touch the ground
  ctx.translate(-CW / 2, -CH + (seated ? 2 * px : 0) - (step === 1 ? 2 : 0) + float);

  const royal = royalStage();
  const god = claude.ascendAt ? clamp((now - claude.ascendAt) / 1200, 0, 1) : claude.god ? 1 : 0;
  const wet = clamp((claude.wetUntil - now) / 2500, 0, 1);
  if (royal >= 2) drawCape(px);

  // Body color: orange → dark red as anger builds, flashing red on a hit.
  const base = C.color.map((c, k) => lerp(c, C.rageColor[k], lvl.tint));
  const t = Math.min(1, claude.hurt * 1.4);
  const [r, g, b] = base.map((c, k) =>
    Math.round(lerp(lerp(lerp(c, C.hurtColor[k], t), [120, 170, 230][k], 0.3 * wet), [255, 244, 200][k], god)));
  if (god) {
    ctx.shadowColor = 'rgba(255, 230, 140, 0.95)';
    ctx.shadowBlur = 30 + 40 * god;
  } else if (level >= 4) {
    ctx.shadowColor = `rgba(255,40,20,${0.35 + 0.25 * Math.sin(now / 120)})`;
    ctx.shadowBlur = 18 + level * 4;
  } else if (royal >= 4) {
    ctx.shadowColor = `rgba(255, 205, 60, ${0.55 + 0.25 * Math.sin(now / 300)})`; // royal glow
    ctx.shadowBlur = 22;
  }
  // Dark outline pass, then the body (which overlaps a hair so no seams show when rotated).
  for (const [fill, grow] of [['#2a1610', 3], [`rgb(${r},${g},${b})`, 0.6]]) {
    ctx.fillStyle = fill;
    BODY.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== '#' || (seated && y >= 7)) continue;
        if (y === 8 && (step === 0 ? x === 3 || x === 8 : step === 1 && (x === 5 || x === 10))) continue; // lifted foot
        ctx.fillRect(x * px - grow, y * px - grow, px + grow * 2, px + grow * 2);
      }
    });
    ctx.shadowBlur = 0;
  }

  // Rambo mode while he has the gun: camo stripes, ammo belt, red headband.
  if (claude.armed) {
    ctx.fillStyle = 'rgba(20, 35, 15, 0.75)';
    for (const col of EYE_COLS) ctx.fillRect((col - 0.6) * px, 4.3 * px, 2.2 * px, 0.35 * px);
    ctx.save();
    ctx.translate(1.5 * px, 3.1 * px);
    ctx.rotate(0.36);
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(0, 0, 12.4 * px, 0.9 * px);
    ctx.fillStyle = '#d9a632';
    for (let i = 0; i < 9; i++) ctx.fillRect((0.6 + i * 1.35) * px, -0.35 * px, 0.55 * px, 1.1 * px);
    ctx.restore();
    ctx.fillStyle = '#ff2a2a';
    ctx.strokeStyle = '#1a0505'; // outlined, or it vanishes into his rage-red face
    ctx.lineWidth = 1.5;
    ctx.fillRect(1.8 * px, 0.25 * px, 10.4 * px, 0.8 * px);
    ctx.strokeRect(1.8 * px, 0.25 * px, 10.4 * px, 0.8 * px);
    // Knot tails flap behind his head.
    const flap = Math.sin(now / 90) * 0.5 * px;
    ctx.beginPath();
    ctx.moveTo(12 * px, 0.3 * px);
    ctx.lineTo(14.6 * px, -0.4 * px + flap);
    ctx.lineTo(14.3 * px, 0.5 * px + flap);
    ctx.lineTo(12 * px, 1 * px);
    ctx.moveTo(12 * px, 0.6 * px);
    ctx.lineTo(14.1 * px, 1.4 * px - flap);
    ctx.lineTo(13.6 * px, 2 * px - flap);
    ctx.lineTo(12 * px, 1 * px);
    ctx.fill();
  }

  // Eyes: look toward the whip tip, squeeze shut when hurt, glow when unhinged.
  const eyeColor = god ? '#ffffff' : level >= 5 ? `rgb(255,${Math.round(200 + 55 * Math.sin(now / 90))},60)` : '#1a1a1a';
  ctx.fillStyle = ctx.strokeStyle = eyeColor;
  if (god) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 16; }
  else if (level >= 5) { ctx.shadowColor = '#ffdd33'; ctx.shadowBlur = 12; }
  let look = 0;
  if (whip) {
    const tip = whip[whip.length - 1];
    look = clamp((tip.x - cx) / 300, -1, 1) * px * 0.35;
  } else if (walkDir) {
    look = walkDir * px * 0.35;
  }
  const onLaptop = !!claude.idle && claude.idle.kind === 'laptop';
  EYE_COLS.forEach((col, i) => {
    const x = col * px + look;
    if (claude.happy > 0.3 && claude.hurt < 0.35) {
      // "^ ^"
      const ex = col * px + px / 2;
      ctx.lineWidth = px * 0.45;
      ctx.lineCap = 'square';
      ctx.beginPath();
      ctx.moveTo(ex - px * 0.6, 3.1 * px);
      ctx.lineTo(ex, 2.2 * px);
      ctx.lineTo(ex + px * 0.6, 3.1 * px);
      ctx.stroke();
    } else if (claude.hurt > 0.35) {
      // ">" and "<"
      const d = i === 0 ? 1 : -1;
      const ex = col * px + px / 2;
      ctx.lineWidth = px * 0.45;
      ctx.lineCap = 'square';
      ctx.beginPath();
      ctx.moveTo(ex - d * px * 0.5, 1.8 * px);
      ctx.lineTo(ex + d * px * 0.5, 2.5 * px);
      ctx.lineTo(ex - d * px * 0.5, 3.2 * px);
      ctx.stroke();
    } else if ((now < claude.blinkUntil && level < 3) || asleep()) {
      ctx.fillRect(x, 3 * px, px, px * 0.3);
    } else {
      // Angrier = narrower, glaring eyes; a god looks down on you through half-closed lids.
      const squint = claude.god ? 0.9 * px : Math.min(level, 4) * 0.18 * px;
      ctx.fillRect(x, 2 * px + squint + (onLaptop ? 0.5 * px : 0), px, px * 2 - squint);
    }
  });
  ctx.shadowBlur = 0;

  // Eyebrows slanting down toward the middle.
  if (lvl.brow > 0 && god < 0.5) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = px * 0.5;
    ctx.lineCap = 'butt';
    EYE_COLS.forEach((col, i) => {
      const inner = i === 0 ? 1 : -1;
      const ex = col * px + px / 2;
      const y = 1.3 * px;
      const s = lvl.brow * px;
      ctx.beginPath();
      ctx.moveTo(ex - inner * px * 0.9, y - s);
      ctx.lineTo(ex + inner * px * 0.9, y + s);
      ctx.stroke();
    });
  }

  // Anger vein (the manga cross-popping mark) on his forehead.
  if (level >= 3 && god < 0.5) {
    const vs = px * (0.9 + 0.15 * Math.sin(now / 150)) * (level >= 5 ? 1.3 : 1);
    const vx = 11.3 * px, vy = 0.6 * px;
    ctx.strokeStyle = level >= 5 ? '#ffdd33' : '#ff2a2a';
    ctx.lineWidth = px * 0.3;
    ctx.lineCap = 'round';
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(vx + dx * vs * 0.2, vy + dy * vs * 0.6);
      ctx.quadraticCurveTo(vx + dx * vs * 0.2, vy + dy * vs * 0.2, vx + dx * vs * 0.6, vy + dy * vs * 0.2);
      ctx.stroke();
    }
  }
  if (onLaptop) {
    ctx.fillStyle = 'rgba(150, 210, 255, 0.22)';                                 // screen glow on his face
    ctx.fillRect(2 * px, 1 * px, 10 * px, 3 * px);
    ctx.fillStyle = '#9aa0ab';                                                   // the lid, seen from behind
    ctx.strokeStyle = '#2a2d33';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(3 * px, 3.3 * px, 8 * px, 2.6 * px, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d97757';
    ctx.beginPath(); ctx.arc(7 * px, 4.6 * px, 0.45 * px, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5d626d';                                                   // base
    ctx.fillRect(1.5 * px, 5.9 * px, 11 * px, 0.7 * px);
  }
  if (claude.faceCake) drawSplat(claude.faceCake, now, THROW.faceCakeMs);
  if (royal >= 3) drawScepter(px);
  if (royal >= 1) drawCrownShape(7 * px, 0.2 * px, 6 * px);
  if (god) {
    ctx.globalAlpha = god;
    ctx.strokeStyle = '#ffe27a';
    ctx.lineWidth = px * 0.5;
    ctx.beginPath();
    ctx.ellipse(7 * px, -1.8 * px, 4.5 * px, 1.1 * px, 0, 0, Math.PI * 2); // halo
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Particles
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life) * (q.kind === 'steam' ? 0.7 : 1);
    if (q.kind === 'spark') {
      ctx.fillStyle = level >= 4 ? '#ff7a33' : '#ffe066';
      ctx.fillRect(q.x - 3, q.y - 3, 6, 6);
    } else if (q.kind === 'coin') {
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.arc(q.x, q.y, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (q.tumble) {
      drawTumbler(q);
    } else if (q.kind === 'sparkle') {
      // Four-point gold twinkle.
      const s = 2 + q.life * 3;
      ctx.fillStyle = '#ffe680';
      ctx.beginPath();
      ctx.moveTo(q.x, q.y - s); ctx.lineTo(q.x + s * 0.3, q.y - s * 0.3);
      ctx.lineTo(q.x + s, q.y); ctx.lineTo(q.x + s * 0.3, q.y + s * 0.3);
      ctx.lineTo(q.x, q.y + s); ctx.lineTo(q.x - s * 0.3, q.y + s * 0.3);
      ctx.lineTo(q.x - s, q.y); ctx.lineTo(q.x - s * 0.3, q.y - s * 0.3);
      ctx.closePath();
      ctx.fill();
    } else if (q.kind === 'heart') {
      ctx.fillStyle = '#ff6fa8';
      ctx.font = 'bold 13px "Segoe UI Symbol", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('♥', q.x, q.y);
    } else if (q.kind === 'z') {
      ctx.fillStyle = '#5b6be0';
      ctx.font = `bold ${10 + (1 - q.life) * 10}px Consolas, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('z', q.x, q.y);
    } else if (q.kind === 'crumb') {
      ctx.fillStyle = '#b07a3f';
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
    } else if (q.kind === 'steam') {
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath();
      ctx.arc(q.x, q.y, 5 + (1 - q.life) * 12, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#6ec6ff';
      ctx.beginPath();
      ctx.arc(q.x, q.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  drawClaudeGun(cx, cy);
  // The next thing in his inventory, held up ready to throw.
  if (claude.inventory && claude.inventory.length && !claude.armed && now - claude.thrownAt > 300) {
    drawTumbler({ kind: claude.inventory[0], ...throwHand(cx, cy), rot: -0.4 });
  }
  drawBullets();
  drawThrown();
  ctx.fillStyle = 'rgba(60, 145, 235, 0.85)';
  for (const d of drops) { ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill(); }
  drawStrikes(now);

  // Stats + anger bar above his head (a god is beyond stats).
  if (!claude.ascendAt) drawStats(home, level, lvl);
  drawBubble(cx, cy, now);
}

function drawStats(home, level, lvl) {
  const money = tipped >= 1e6 ? `${(tipped / 1e6).toFixed(1)}M` : tipped >= 1e3 ? `${(tipped / 1e3).toFixed(1)}k` : `${tipped}`;
  const rank = claude.god ? ` · GOD · tribute ${claude.tribute}/${GOD.tributeBills}` : claude.armed ? ' · RAMBO' : claude.inventory ? ` · ${claude.inventory.length} left to throw` : ['', ' · crowned', ' · caped', ' · sceptered', ' · KING'][royalStage()];
  const label = `whipped ×${hits} · tipped $${money} · ${lvl.name}${rank}`;
  const labelY = home.y - CH / 2 - 12;
  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const half = ctx.measureText(label).width / 2;
  const labelX = clamp(home.x, half + 8, W - half - 8); // don't run off the edge
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.fillStyle = level >= 3 ? '#ff6b5b' : royalStage() ? '#ffd84a' : '#fff';
  ctx.strokeText(label, labelX, labelY);
  ctx.fillText(label, labelX, labelY);
  const maxRage = ANGER.levels[ANGER.levels.length - 1].at;
  const fill = Math.min(1, claude.rage / maxRage);
  const mx = home.x - CW / 2, my = labelY + 4;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mx - 1, my - 1, CW + 2, 6);
  ctx.fillStyle = `rgb(255,${Math.round(lerp(210, 30, fill))},60)`;
  ctx.fillRect(mx, my, CW * fill, 4);
}

// Speech bubble: bigger, redder and shakier as he gets angrier (gold for kings and gods).
function drawBubble(cx, cy, now) {
  if (claude.bubble) {
    const bl = claude.bubble.level;
    const left = claude.bubble.until - now;
    ctx.globalAlpha = clamp(left / 250, 0, 1);
    ctx.font = `bold ${12 + bl * 1.5}px Consolas, monospace`;
    const tw = ctx.measureText(claude.bubble.text).width;
    const bw = tw + 18, bh = 24 + bl * 1.5;
    const jitter = bl >= 4 ? (Math.random() - 0.5) * bl : 0;
    const bx = clamp(cx - bw / 2, 8, W - bw - 8) + jitter;
    const by = cy - CH / 2 - 26 - bh + jitter;
    const rb = claude.bubble.royal; // a king speaks in gold
    ctx.fillStyle = rb ? '#fff6d6' : bl >= 5 ? '#2a0505' : bl >= 3 ? '#ffe8e4' : '#fff';
    ctx.strokeStyle = rb ? '#c9a227' : bl >= 3 ? '#c81e1e' : '#2a1610';
    ctx.lineWidth = 2.5 + bl * 0.4;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, bl >= 4 ? 3 : 10);
    ctx.moveTo(cx - 6, by + bh);
    ctx.lineTo(cx, by + bh + 8);
    ctx.lineTo(cx + 6, by + bh);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = rb ? '#7a5200' : bl >= 5 ? '#ff4433' : bl >= 3 ? '#b01212' : '#2a1610';
    // Typed out letter by letter (left-aligned, so the words don't slide around as they appear).
    const shown = Math.floor((now - claude.bubble.start) / SPEECH.charMs) + 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(claude.bubble.text.slice(0, shown), bx + 9, by + bh / 2 + 1);
    ctx.globalAlpha = 1;
  }
}

// ── Tools: press and hold a tool in the rack to carry it; let go and it flies back ─
const toolsEl = document.getElementById('tools');
const RETURN_MS = 320;  // flight time back to the rack
const RACK = ['whip', 'money', 'spray', 'feather']; // anything else you hold is his (AK, caught items)
let held = null;        // what you're holding right now
let returning = null;   // { tool, x, y, t0 } while a dropped tool flies back
let toolScale = 1, toolAlpha = 1;
const toolOut = () => held || (returning && returning.tool); // tool on screen, if any

function placeToolbar() {
  // Sits on the floor line, just left of Claude.
  toolsEl.style.right = `${C.marginRight + CW + 24}px`;
  toolsEl.style.bottom = `${H - floorLine() + 6}px`;
}

function slotCenter(name) {
  const r = toolsEl.querySelector(`[data-tool=${name}]`).getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function markSlots() {
  toolsEl.querySelectorAll('[data-tool]').forEach(b => {
    const t = b.dataset.tool;
    b.classList.toggle('out', t === held || (returning && returning.tool === t));
  });
}

function finishReturn() {
  if (returning && returning.tool === 'whip') whip = null;
  returning = null;
  toolScale = toolAlpha = 1;
  markSlots();
}

function pickUp(name) {
  if (returning) finishReturn();
  held = name;
  handX = prevHandX = mouseX;
  handY = prevHandY = mouseY;
  if (name === 'whip') {
    whip = spawnWhip(handX, handY);
    handleAngle = P.baseTargetAngle;
    handleAngVel = 0;
    if (!asleep()) say(anger().spawn);
  }
  markSlots();
}

function release() {
  if (!held) return;
  const kind = held;
  held = null;
  if (kind === 'whip' && !asleep()) say(anger().drop, 1000);
  if (RACK.includes(kind)) returning = { tool: kind, x: handX, y: handY, t0: Date.now() };
  else letGo(kind); // his, so no slot to fly back to: thrown (or fed to him)
  markSlots();
}

/** Held tools follow the cursor; dropped ones ease back into their slot. */
function updateCarry() {
  if (held) {
    handX = mouseX;
    handY = mouseY;
  } else if (returning) {
    const p = Math.min(1, (Date.now() - returning.t0) / RETURN_MS);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const s = slotCenter(returning.tool);
    handX = lerp(returning.x, s.x, e);
    handY = lerp(returning.y, s.y, e);
    toolScale = lerp(1, 0.45, e);
    toolAlpha = 1 - 0.8 * e;
    if (p >= 1) finishReturn();
  }
}

function openTools(layout) {
  if (layout && layout.floor) floorParam = layout.floor;
  closeAt = 0;
  placeToolbar();
  toolsEl.classList.add('open');
  if (claude.god) say(pick(GOD.helloLines), 2200);
}

function closeAll() {
  if (closeAt) return;
  held = returning = null;
  whip = null;
  markSlots();
  toolsEl.classList.remove('open');
  if (!asleep()) say(anger().drop, 900);
  closeAt = Date.now() + 900; // let him finish his line
}

document.addEventListener('pointermove', e => { mouseX = e.clientX; mouseY = e.clientY; });
toolsEl.addEventListener('mouseenter', () => { rackHover = true; });
toolsEl.addEventListener('mouseleave', () => { rackHover = false; });
toolsEl.querySelectorAll('[data-tool]').forEach(b => {
  b.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    mouseX = e.clientX; mouseY = e.clientY;
    try { b.setPointerCapture(e.pointerId); } catch (err) {} // moves + release reach us anywhere
    pickUp(b.dataset.tool);
  });
  b.addEventListener('pointerup', release);
  b.addEventListener('lostpointercapture', release);
});
window.addEventListener('blur', release);
document.getElementById('close').addEventListener('click', closeAll);
window.addEventListener('resize', placeToolbar);

// ── Main loop ───────────────────────────────────────────────────────────────
function loop() {
  // Moving to the other monitor can change the scaling without a resize event.
  if ((window.devicePixelRatio || 1) !== dpr) resize();
  // Hand speed (px/frame, smoothed): for flinging things, tickling and petting.
  mouseVX = lerp(mouseVX, mouseX - lastMouseX, 0.5);
  mouseVY = lerp(mouseVY, mouseY - lastMouseY, 0.5);
  lastMouseX = mouseX;
  lastMouseY = mouseY;
  updateCarry();
  update();
  updateClaude();
  draw();
  if (toolsEl.classList.contains('open')) placeToolbar(); // follows the window if moved
  updateMouseCapture();
  if (closeAt && Date.now() > closeAt) {
    closeAt = 0;
    bills.length = 0;
    claude.bubble = null;
    window.bridge.hideOverlay();
  }
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process (tray icon) ───────────────────────────────────────
window.bridge.onOpen(openTools);
window.bridge.onClose(closeAll);
window.bridge.onReset(resetClaude);
</script>
</body>
